<script>
function colorchange() {
  let r = Math.floor(Math.random() * 255);
  let g = Math.floor(Math.random() * 255);
  let b = Math.floor(Math.random() * 255);
  let randcolor = "rgb(" + r + ", " + g + ", " + b + ")"
  document.getElementById("colorblock").style.backgroundColor = randcolor;
}

function colornoise() {
    let r = 255;
    let g = 255;
    let b = 255;
	let randcolor = "rgb(255, 255, 255)"
	let i = 1
	let documentid = "noise1"
  while (i < 400) {
    r = Math.floor(Math.random() * 255);
    g = Math.floor(Math.random() * 255);
    b = Math.floor(Math.random() * 255);
    randcolor = "rgb(" + r + ", " + g + ", " + b + ")"
	documentid = "noise" + i
    document.getElementById(documentid).style.backgroundColor = randcolor;
	i = i+1;
  }
}
